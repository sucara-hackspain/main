# The showcase on a VPS behind caddy-docker-proxy (network `previews`): the engine in live mode (a night is started from
# the Control Center; the 112 desk, the real line and the ring-backs come with it), the Control Center following it.
# https://hackspain.eighteen.sh is the viewer, /phone and /followup the webhooks of the voice workflows.
#   mkdir -p /opt/hackspain/{runs,memory} && cp observatory/.env /opt/hackspain/observatory.env
#   docker compose -f deploy/preview/docker-compose.yml up -d --build
name: hackspain
services:
  engine:
    build: { context: ../.., dockerfile: deploy/preview/Dockerfile }
    image: hackspain-sim:latest
    working_dir: /app/observatory
    # Live mode: one process that owns the only session (started from the Control Center through :8113) and the 112
    # line's webhook on :8112. At start, only the twelve newest runs are kept (a night is tens of megabytes).
    command: ["sh", "-c", "ls -td runs/*/ 2>/dev/null | tail -n +13 | xargs -r rm -rf; exec node_modules/.bin/tsx --env-file=.env src/live.ts"]
    environment:
      LIVE_PHONE_PORT: "8112"
      LIVE_CONTROL_PORT: "8113"
      # The viewer is another container: the control API must listen beyond localhost (the port is not published).
      LIVE_CONTROL_HOST: "0.0.0.0"
    volumes:
      - /opt/hackspain/runs:/app/observatory/runs
      - /opt/hackspain/memory:/app/observatory/memory
      - /opt/hackspain/observatory.env:/app/observatory/.env:ro
    networks: [previews]
    restart: unless-stopped
    labels:
      caddy: hackspain.eighteen.sh
      # The two webhooks of the voice workflows, open; everything else goes to the viewer, behind its password.
      caddy.@hooks.path: /phone* /followup*
      caddy.1_handle: "@hooks"
      caddy.1_handle.reverse_proxy: "{{upstreams 8112}}"
  ui:
    image: hackspain-sim:latest
    depends_on: [engine]
    working_dir: /app/observatory
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      # Set in deploy/preview/.env on the host: the viewer then asks for it (user CONTROL_CENTER_USER, default hackspain).
      CONTROL_CENTER_PASSWORD: ${CONTROL_CENTER_PASSWORD:-}
      CONTROL_CENTER_USER: ${CONTROL_CENTER_USER:-hackspain}
      # The live mode lives in the engine container: the page's /api/live goes there.
      LIVE_URL: http://engine:8113
    volumes:
      - /opt/hackspain/runs:/app/observatory/runs:ro
    networks: [previews]
    restart: unless-stopped
    labels:
      caddy: hackspain.eighteen.sh
      caddy.2_handle: /*
      caddy.2_handle.reverse_proxy: "{{upstreams 5173}}"
      caddy.2_handle.reverse_proxy.header_up: "Host localhost"
networks:
  previews:
    external: true
